<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Curious Agents Club — October 2026 Cohort Atlas</title>
  <meta name="description" content="Explore the October 2026 Mastering Agentic AI cohort around the world.">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="icon" type="image/png" href="./assets/ting-head.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#atlas" aria-label="The Gen Academy October cohort atlas">
      <img src="./assets/tga-logo-transparent.png" alt="The Gen Academy">
      <span class="brand-cohort"><strong>The Curious Agents Club</strong><br>Mastering Agentic AI · <b>October 2026</b></span>
    </a>
  </header>
  <main id="atlas">
    <section class="intro" aria-labelledby="page-title">
      <div class="headline">
        <h1 id="page-title">Hello,<br><em>October cohort members!</em></h1>
        <p>Search the October 2026 cohort by name, country, state, or city.</p>
      </div>
      <figure class="mascot">
        <div class="mascot-crew" role="img" aria-label="Glo and Lumi, The Gen Academy mascots">
          <div class="glo-sprite glo-standing" aria-hidden="true"></div>
          <div class="glo-sprite lumi-standing" aria-hidden="true"></div>
        </div>
      </figure>
    </section>
    <section class="map-shell" aria-label="Interactive cohort map">
      <aside class="map-panel">
        <label for="place">Search cohort locations</label>
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="place" type="search" autocomplete="off" placeholder="Name, country, state, or city"></div>
        <p id="searchStatus" class="search-status" aria-live="polite">Loading cohort members…</p>
        <div id="results" class="results" role="listbox" aria-label="Search results"></div>
      </aside>
      <div id="map" role="application" aria-label="World map of October 2026 cohort members"></div>
    </section>
    <div class="brand-footer">
      <img src="./assets/tga-logo-dark.png" alt="The Gen Academy">
    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="./app.js"></script>
</body>
</html>
